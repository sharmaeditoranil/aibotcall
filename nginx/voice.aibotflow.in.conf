# ==============================================================================
# Nginx Configuration for voice.aibotflow.in
# AiBotCall - AI Voice Calling & Telephony Platform
# ==============================================================================

upstream aibotcall_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# HTTP Server (Certbot will automatically upgrade this to HTTPS with SSL)
server {
    listen 80;
    listen [::]:80;
    server_name voice.aibotflow.in;

    # Frontend SPA Root
    root /var/www/voice.aibotflow.in/frontend/dist;
    index index.html;

    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Telephony Realtime WebSocket Gateway (/exotel/media & /voice/media)
    # --------------------------------------------------------------------------
    location /exotel/media {
        proxy_pass http://aibotcall_backend/exotel/media;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /voice/media {
        proxy_pass http://aibotcall_backend/voice/media;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Backend REST API Routes (/api/*)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://aibotcall_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Static Frontend SPA Routing (HTML5 History Mode)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
