# ==============================================================================
# Nginx Configuration for voice.aibotflow.in
# AiBotCall - AI Voice Calling & Telephony Platform
# ==============================================================================

# Rate limit zone for incoming leads webhook
limit_req_zone $binary_remote_addr zone=voice_lead_limit:10m rate=30r/s;

upstream aibotcall_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# 1. HTTP Server - Certbot SSL & HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name voice.aibotflow.in;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS Server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name voice.aibotflow.in;

    # SSL Certificates (managed via certbot --nginx -d voice.aibotflow.in)
    ssl_certificate /etc/letsencrypt/live/voice.aibotflow.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.aibotflow.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Uploads limit for CSV contact lists
    client_max_body_size 50M;

    # Root directory for Frontend SPA
    root /var/www/voice.aibotflow.in/frontend/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # Telephony Realtime WebSocket Gateway (/exotel/media & /voice/media)
    # --------------------------------------------------------------------------
    location /exotel/media {
        proxy_pass http://aibotcall_backend/exotel/media;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1-hour timeouts to support long calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location /voice/media {
        proxy_pass http://aibotcall_backend/voice/media;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Backend REST API Routes (/api/*)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://aibotcall_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Rate limited webhook lead ingestion
    location /api/v1/webhooks/leads {
        limit_req zone=voice_lead_limit burst=50 nodelay;

        proxy_pass http://aibotcall_backend/api/v1/webhooks/leads;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health check
    location /health {
        proxy_pass http://aibotcall_backend/health;
        proxy_http_version 1.1;
    }

    # --------------------------------------------------------------------------
    # Static Frontend SPA Routing (HTML5 History Mode)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
