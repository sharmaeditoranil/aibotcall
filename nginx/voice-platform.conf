# Rate limiting zone for incoming webhook leads
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/s;

# Upstream Backend
upstream aibotcall_backend {
    server app:4000;
    keepalive 32;
}

# HTTP - Redirect to HTTPS (or serve Certbot challenges)
server {
    listen 80;
    listen [::]:80;
    server_name voice.yourdomain.com api.yourdomain.com app.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name voice.yourdomain.com api.yourdomain.com app.yourdomain.com;

    # SSL Certificates (Configure with Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/voice.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice.yourdomain.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Maximum Body Size for CSV Contact Uploads
    client_max_body_size 25M;

    # =======================================================
    # 1. Dedicated WebSocket Voice Media Streaming (/exotel/media)
    # =======================================================
    location /exotel/media {
        proxy_pass http://aibotcall_backend/exotel/media;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keepalive and Long Read/Send Timeouts for Ongoing Phone Calls
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Generic Voice Media Stream Alias
    location /voice/media {
        proxy_pass http://aibotcall_backend/voice/media;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # =======================================================
    # 2. Rate-Limited Website Lead Ingestion Webhook
    # =======================================================
    location /api/v1/webhooks/leads {
        limit_req zone=webhook_limit burst=30 nodelay;

        proxy_pass http://aibotcall_backend/api/v1/webhooks/leads;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =======================================================
    # 3. REST API Routes
    # =======================================================
    location /api/ {
        proxy_pass http://aibotcall_backend/api/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # =======================================================
    # 4. Frontend Dashboard (Served via Backend Fastify Static)
    # =======================================================
    location / {
        proxy_pass http://aibotcall_backend/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_intercept_errors off;
    }
}
